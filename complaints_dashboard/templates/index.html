<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Complaints Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<header>
  <h1>Complaints dashboard</h1>
</header>

<section class="filters" id="filters">
  <div class="filter-group">
    <label for="start">From</label>
    <input type="date" id="start">
  </div>
  <div class="filter-group">
    <label for="end">To</label>
    <input type="date" id="end">
  </div>
  <div class="filter-group">
    <label for="category">Category</label>
    <select id="category"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label for="region">Region</label>
    <select id="region"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label for="status">Status</label>
    <select id="status"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label for="priority">Priority</label>
    <select id="priority"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label for="channel">Channel</label>
    <select id="channel"><option value="">All</option></select>
  </div>
  <button id="apply-filters">Apply</button>
  <button id="reset-filters">Reset</button>
</section>

<section class="kpis" id="kpis">
  <div class="kpi-card">
    <div class="kpi-value" id="kpi-total">–</div>
    <div class="kpi-label">Total complaints</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-value" id="kpi-open">–</div>
    <div class="kpi-label">Currently open</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-value" id="kpi-avg-days">–</div>
    <div class="kpi-label">Avg. days to close</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-value" id="kpi-sla-breach">–</div>
    <div class="kpi-label">SLA breach rate</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-value" id="kpi-reopened">–</div>
    <div class="kpi-label">Reopened</div>
  </div>
</section>

<section class="charts">
  <div class="chart-card wide">
    <h2>Complaints opened per month</h2>
    <canvas id="chart-trend"></canvas>
  </div>
  <div class="chart-card">
    <h2>By category</h2>
    <canvas id="chart-category"></canvas>
  </div>
  <div class="chart-card">
    <h2>By region</h2>
    <canvas id="chart-region"></canvas>
  </div>
  <div class="chart-card">
    <h2>By priority</h2>
    <canvas id="chart-priority"></canvas>
  </div>
  <div class="chart-card">
    <h2>By channel</h2>
    <canvas id="chart-channel"></canvas>
  </div>
</section>

<section class="table-section">
  <h2>Recent complaints</h2>
  <table id="complaints-table">
    <thead>
      <tr>
        <th>ID</th><th>Opened</th><th>Closed</th><th>Status</th><th>Channel</th>
        <th>Category</th><th>Priority</th><th>Region</th><th>Days to close</th><th>SLA breach</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="pagination">
    <button id="prev-page">Previous</button>
    <span id="page-info"></span>
    <button id="next-page">Next</button>
  </div>
</section>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>

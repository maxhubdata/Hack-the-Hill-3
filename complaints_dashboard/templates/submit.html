<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Submit a complaint</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header style="text-align: center;">
  <h1>Submit a complaint</h1>
</header>

{% if request.args.get('success') %}
  <div class="success-banner">
    Complaint <strong>{{ request.args.get('success') }}</strong> submitted successfully.
  </div>
{% endif %}

<form class="submit-form" method="POST" action="{{ url_for('submit_complaint') }}">

  <div class="form-row">
    <label for="channel">Channel</label>
    <select name="channel" id="channel" required>
      {% for value in options.channel %}
        <option value="{{ value }}">{{ value }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-row">
    <label for="category">Category</label>
    <select name="category" id="category" required>
      {% for value in options.category %}
        <option value="{{ value }}">{{ value }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-row">
    <label for="priority">Priority</label>
    <select name="priority" id="priority" required>
      {% for value in options.priority %}
        <option value="{{ value }}">{{ value }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-row">
    <label for="region">Region</label>
    <select name="region" id="region" required>
      {% for value in options.region %}
        <option value="{{ value }}">{{ value }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-row">
    <label for="account_id">Account ID</label>
    <input type="text" name="account_id" id="account_id" placeholder="ACC-123456" required>
  </div>

  <button type="submit">Submit complaint</button>
</form>

<p style="text-align: center;"><a href="{{ url_for('index') }}" style="font-size: 22px;">&larr; Back to dashboard</a></p>

</body>
</html>
